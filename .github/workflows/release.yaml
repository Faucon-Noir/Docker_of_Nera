name: Latest Release

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build-latest:
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'dev'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Version Change
        id: version
        run: |
          set -euo pipefail
          FILE="DockerFile"
          if [ ! -f "$FILE" ]; then
            echo "Docker file $FILE not found" >&2
            exit 1
          fi
          VERSION=$(grep -E '^LABEL version=' "$FILE" | sed -E 's/^LABEL version="([^"]+)".*/\1/' || true)
          if [ -z "${VERSION}" ]; then
            echo "LABEL version not found in $FILE" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Latest Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./DockerFile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_REPO }}:${{ steps.version.outputs.version }}
             ${{ vars.DOCKERHUB_REPO }}:latest
